name: CI

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: cargo test

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-wasip1
      - run: cargo clippy --target wasm32-wasip1

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
